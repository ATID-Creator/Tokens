<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アジア貿易シミュレーション</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <div class="header__brand">
        <span class="header__icon">⛩</span>
        <div>
          <h1>アジア貿易シミュレーション</h1>
          <p class="header__subtitle">Silk Road of the East — 東洋の商路を駆け抜けろ</p>
        </div>
      </div>
      <div class="header__stats" id="header-stats"></div>
    </header>

    <main class="main">
      <aside class="panel panel--sidebar">
        <section class="card">
          <h2>現在地</h2>
          <div id="location-info" class="location-info"></div>
        </section>

        <section class="card">
          <h2>貨物庫</h2>
          <div id="cargo-list" class="cargo-list"></div>
          <p class="hint">最大積載量: <span id="cargo-capacity">0</span> 単位</p>
        </section>

        <section class="card">
          <h2>インコタームズ</h2>
          <div id="incoterm-panel" class="incoterm-panel"></div>
        </section>

        <section class="card">
          <h2>航海先</h2>
          <div id="travel-list" class="travel-list"></div>
        </section>

        <section class="card">
          <h2>直近の貿易費用</h2>
          <div id="cost-summary" class="cost-summary"></div>
        </section>
      </aside>

      <section class="panel panel--market">
        <div class="market-header">
          <h2>市場 — <span id="market-city">—</span></h2>
          <div class="market-actions">
            <button id="btn-next-day" class="btn btn--primary">次の日へ進む</button>
            <button id="btn-save" class="btn btn--ghost">セーブ</button>
            <button id="btn-load" class="btn btn--ghost">ロード</button>
          </div>
        </div>

        <div id="event-banner" class="event-banner hidden"></div>

        <div id="market-table" class="market-table"></div>

        <section class="card card--log">
          <h2>航海日誌</h2>
          <div id="game-log" class="game-log"></div>
        </section>
      </section>
    </main>

    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal" id="modal">
        <div id="modal-content"></div>
        <button id="modal-close" class="btn btn--primary">始める</button>
      </div>
    </div>

    <div id="travel-modal-overlay" class="modal-overlay hidden">
      <div class="modal modal--wide" id="travel-modal">
        <h2>🚢 輸出契約 — インコタームズ選択</h2>
        <p id="travel-modal-route" class="travel-modal__route"></p>
        <div id="travel-incoterm-options" class="incoterm-options"></div>
        <div id="travel-cost-breakdown" class="cost-breakdown"></div>
        <div class="travel-modal__actions">
          <button id="travel-cancel" class="btn btn--ghost">キャンセル</button>
          <button id="travel-confirm" class="btn btn--primary">出航する</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
